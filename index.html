<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 測驗終端機</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        /* 將內文字體恢復正常，但標題和按鈕保留科幻感字體 */
        body {
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #2a2a44;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            position: relative;
            animation: fadeIn 1.5s ease-in-out;
        }

        /* 標題與段落的發光效果，使用科幻字體 */
        h1, h2, #question-title {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }
        
        /* 段落文字維持正常字體 */
        p, label {
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
        }

        /* 按鈕基礎樣式，使用科幻字體 */
        button, .question-btn {
            background: linear-gradient(45deg, #007bff, #8a2be2);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 25px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.4);
            font-family: 'Orbitron', sans-serif;
            text-align: center;
        }
        button:hover, .question-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(138, 43, 226, 0.6);
        }
        button:active, .question-btn:active {
            transform: scale(0.95);
        }

        /* 登入表單樣式 */
        #login-form input {
            background: #1a1a2e;
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            box-shadow: inset 0 0 8px rgba(0, 255, 255, 0.3);
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
        }
        #login-form input:focus {
            outline: none;
            box-shadow: 0 0 10px #00ffff, inset 0 0 10px #00ffff;
        }
        
        /* 題目列表樣式 */
        .question-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }
        .question-btn {
            flex: 1 1 calc(16.666% - 15px);
            min-width: 100px;
            text-decoration: none;
            padding: 15px 10px;
        }
        .question-btn.answered {
            background: linear-gradient(45deg, #28a745, #1d9539);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        /* 選擇選項樣式 */
        .options div {
            background: #3a3a54;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.3s;
            border: 1px solid #4a4a6e;
        }
        .options div:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.2);
        }
        .options input[type="radio"], .options input[type="checkbox"] {
            display: none;
        }
        .options label {
            cursor: pointer;
            display: block;
        }
        
        /* 選中後的選項樣式，應用於整個 div */
        .options div.checked {
            background: linear-gradient(45deg, #00ffff, #8a2be2);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
            border-color: #00ffff;
        }
        .options div.checked label {
            color: #1a1a2e;
            font-weight: bold;
            text-shadow: none;
        }
        
        /* 問答區塊樣式 */
        textarea {
            width: 100%;
            height: 100px;
            background: #1a1a2e;
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: inset 0 0 8px rgba(0, 255, 255, 0.3);
            resize: vertical;
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
        }

        /* 排名列表樣式 */
        .ranking-list li {
            background: #3a3a54;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ranking-list li:first-child {
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            color: #333;
            box-shadow: 0 0 20px #ffd700;
        }
        
        /* 載入中畫面 */
        #loading-overlay {
            background: rgba(26, 26, 46, 0.9);
            color: #00ffff;
        }

        /* 進度條樣式 */
        .progress-bar-container {
            width: 100%;
            height: 25px;
            background: #1a1a2e;
            border-radius: 15px;
            box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.3);
            margin: 20px 0;
            overflow: hidden;
            border: 1px solid #00ffff;
        }
        .progress-bar {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #00ffff, #8a2be2);
            transition: width 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
            position: relative;
        }
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.5);
            filter: blur(5px);
            opacity: 0;
            transition: opacity 0.5s;
        }
        .progress-bar.animate::after {
            opacity: 1;
        }

        /* 動畫 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 彈性佈局調整 */
        .header, .nav-buttons, .font-size-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .nav-buttons {
            flex-direction: row;
            justify-content: center;
        }
        .header h1 { margin-bottom: 5px; }
        .header p { margin-top: 0; }
        #questions-view h2, #ranking-view h2 { text-align: center; }
        
    </style>
</head>
<body>

    <div id="loading-overlay">
        <p>資料傳輸中...請稍後</p>
    </div>

    <div class="container">
        <div class="font-size-controls">
            <button onclick="setFontSize('small')">小</button>
            <button onclick="setFontSize('medium')" class="active">中</button>
            <button onclick="setFontSize('large')">大</button>
        </div>

        <div class="header" id="welcome-section">
            <h1>AI 測驗終端機</h1>
            <p>請輸入你的使用者代號以進入系統。</p>
            <form id="login-form">
                <input type="text" id="username-input" placeholder="使用者代號" required>
                <button type="submit">登入</button>
            </form>
        </div>

        <div id="main-quiz-section" style="display: none;">
            <div class="nav-buttons">
                <button id="show-questions-btn">回到題目列表</button>
                <button id="show-ranking-btn">查看排名</button>
            </div>

            <div id="questions-view">
                <h2>系統數據流</h2>
                
                <div id="total-score-container">
                    <h3>總進度</h3>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="score-progress-bar"></div>
                    </div>
                    <div id="current-score-text"></div>
                </div>

                <div class="question-list" id="question-list-container"></div>
            </div>

            <div id="quiz-view" style="display: none;">
                <h2 id="question-title"></h2>
                <p id="question-text"></p>
                <div id="score-info"></div>
                <div class="options" id="options-container"></div>
                <div id="attempts-info"></div>
                <button id="submit-btn">提交答案</button>
            </div>
            
            <div id="ranking-view" style="display: none;">
                <h2>核心資料庫排名</h2>
                <ul class="ranking-list" id="ranking-container"></ul>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzkhhV9y6iHlWY14V4ucYNqNkkYJ5LAbfi8nEhF9vX7E8O-rs05P5d4qfnh47QibyFx/exec"; 

        let questions = [];
        let username = '';
        let userStatus = { responses: {}, attempts: {}, totalScore: 0 };
        let currentQuestion = null;
        let maxPossibleScore = 0;

        const welcomeSection = document.getElementById('welcome-section');
        const mainQuizSection = document.getElementById('main-quiz-section');
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username-input');
        const questionsView = document.getElementById('questions-view');
        const quizView = document.getElementById('quiz-view');
        const rankingView = document.getElementById('ranking-view');
        const questionListContainer = document.getElementById('question-list-container');
        const questionTitle = document.getElementById('question-title');
        const questionText = document.getElementById('question-text');
        const scoreInfo = document.getElementById('score-info');
        const optionsContainer = document.getElementById('options-container');
        const attemptsInfo = document.getElementById('attempts-info');
        const submitBtn = document.getElementById('submit-btn');
        const rankingContainer = document.getElementById('ranking-container');
        const showQuestionsBtn = document.getElementById('show-questions-btn');
        const showRankingBtn = document.getElementById('show-ranking-btn');
        const loadingOverlay = document.getElementById('loading-overlay');
        const scoreProgressBar = document.getElementById('score-progress-bar');
        const totalScoreContainer = document.getElementById('total-score-container');
        const currentScoreText = document.getElementById('current-score-text');

        document.addEventListener('DOMContentLoaded', () => {
            setFontSize('medium');
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                username = usernameInput.value.trim();
                if (username) {
                    welcomeSection.style.display = 'none';
                    mainQuizSection.style.display = 'block';
                    showLoading();
                    loadUserStatus()
                        .then(() => loadQuestions())
                        .finally(hideLoading);
                }
            });

            showQuestionsBtn.addEventListener('click', showQuestionsList);
            showRankingBtn.addEventListener('click', () => {
                showLoading();
                showRanking().finally(hideLoading);
            });
            submitBtn.addEventListener('click', () => {
                showLoading();
                submitAnswer().finally(hideLoading);
            });
        });

        function showLoading() {
            loadingOverlay.style.display = 'flex';
        }
        
        function hideLoading() {
            loadingOverlay.style.display = 'none';
        }

        function setFontSize(size) {
            document.querySelectorAll('.font-size-controls button').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.font-size-controls button[onclick="setFontSize('${size}')"]`).classList.add('active');
            
            let fontSizeValue;
            if (size === 'small') {
                fontSizeValue = '14px';
            } else if (size === 'medium') {
                fontSizeValue = '16px';
            } else if (size === 'large') {
                fontSizeValue = '18px';
            }
            
            document.documentElement.style.fontSize = fontSizeValue;
            questionText.style.fontSize = fontSizeValue;
        }

        function showQuestionsList() {
            quizView.style.display = 'none';
            rankingView.style.display = 'none';
            questionsView.style.display = 'block';
            totalScoreContainer.style.display = 'block'; 
            updateProgressBar();
            renderQuestionList();
        }

        function showRanking() {
            questionsView.style.display = 'none';
            quizView.style.display = 'none';
            rankingView.style.display = 'block';
            return fetchRanking();
        }

        function fetchAPI(action, params = {}) {
            const formData = new FormData();
            formData.append('action', action);
            for (const key in params) {
                formData.append(key, params[key]);
            }
            return fetch(WEB_APP_URL, {
                method: 'POST',
                body: formData
            }).then(res => res.json());
        }

        function loadQuestions() {
            return fetchAPI('getQuestions').then(data => {
                if (data.error) {
                    alert('載入題目失敗: ' + data.error);
                    return;
                }
                questions = data;
                maxPossibleScore = questions.reduce((sum, q) => sum + (q['滿分'] || 1), 0);
                renderQuestionList();
            });
        }
        
        function loadUserStatus() {
            return fetchAPI('getUserStatus', { name: username }).then(data => {
                if (data.error) {
                    console.error('載入使用者狀態失敗:', data.error);
                } else {
                    userStatus = data;
                    updateProgressBar();
                }
            });
        }

        function renderQuestionList() {
            questionListContainer.innerHTML = '';
            questions.forEach(q => {
                const btn = document.createElement('a');
                btn.href = '#';
                btn.textContent = `題目 ${q['題號']}`;
                btn.className = 'question-btn';
                if (userStatus.responses[q['題號']] && userStatus.responses[q['題號']].score > 0) {
                    btn.classList.add('answered');
                }
                btn.onclick = () => showQuestion(q);
                questionListContainer.appendChild(btn);
            });
        }

        function showQuestion(question) {
            questionsView.style.display = 'none';
            rankingView.style.display = 'none';
            quizView.style.display = 'block';
            totalScoreContainer.style.display = 'none';

            currentQuestion = question;
            questionTitle.textContent = `第 ${question['題號']} 題`;
            questionText.textContent = question['題目'];
            
            const fullScore = question['滿分'] || 1;
            scoreInfo.textContent = `這題滿分：${fullScore} 分`;
            
            optionsContainer.innerHTML = '';

            const attemptsLeft = (question['作答次數限制'] || 1) - (userStatus.attempts[question['題號']] || 0);
            attemptsInfo.textContent = `剩餘作答次數: ${attemptsLeft}`;

            if (question['題型'] === '問答') {
                const textarea = document.createElement('textarea');
                textarea.rows = 4;
                textarea.cols = 50;
                textarea.id = 'answer-textarea';
                optionsContainer.appendChild(textarea);
            } else if (question['題型'] === '單選') {
                for (let i = 1; i <= 5; i++) {
                    const optionKey = `選項${i}`;
                    const optionValue = question[optionKey];
                    if (optionValue) {
                        const optionDiv = document.createElement('div');
                        const input = document.createElement('input');
                        const label = document.createElement('label');
                        const optionLetter = String.fromCharCode(64 + i);

                        input.type = 'radio';
                        input.name = 'answer';
                        input.value = optionLetter;
                        
                        label.textContent = `${optionLetter}. ${optionValue}`;
                        label.prepend(input);
                        
                        optionDiv.appendChild(label);
                        optionsContainer.appendChild(optionDiv);

                        // 為單選選項添加點擊事件
                        optionDiv.addEventListener('click', () => {
                            optionsContainer.querySelectorAll('div').forEach(div => div.classList.remove('checked'));
                            optionDiv.classList.add('checked');
                            // 確保 radio 按鈕狀態同步
                            input.checked = true;
                        });
                    }
                }
            } else if (question['題型'] === '多選') {
                 for (let i = 1; i <= 5; i++) {
                    const optionKey = `選項${i}`;
                    const optionValue = question[optionKey];
                    if (optionValue) {
                        const optionDiv = document.createElement('div');
                        const input = document.createElement('input');
                        const label = document.createElement('label');
                        const optionLetter = String.fromCharCode(64 + i);

                        input.type = 'checkbox';
                        input.name = 'answer';
                        input.value = optionLetter;
                        
                        label.textContent = `${optionLetter}. ${optionValue}`;
                        label.prepend(input);
                        
                        optionDiv.appendChild(label);
                        optionsContainer.appendChild(optionDiv);

                        // 為多選選項添加點擊事件
                        optionDiv.addEventListener('click', () => {
                            optionDiv.classList.toggle('checked');
                            // 確保 checkbox 按鈕狀態同步
                            input.checked = optionDiv.classList.contains('checked');
                        });
                    }
                }
            }
            
            submitBtn.disabled = attemptsLeft <= 0;
            submitBtn.textContent = submitBtn.disabled ? '已無作答次數' : '提交答案';
        }

        function submitAnswer() {
            return new Promise((resolve, reject) => {
                if (!currentQuestion) {
                    alert('沒有選擇題目，無法提交');
                    reject('no question');
                    return;
                }

                let answer = '';
                if (currentQuestion['題型'] === '問答') {
                    const textarea = document.getElementById('answer-textarea');
                    if (textarea) {
                        answer = textarea.value.trim();
                    }
                } else if (currentQuestion['題型'] === '單選') {
                    const checkedRadio = optionsContainer.querySelector('input[name="answer"]:checked');
                    if (checkedRadio) {
                        answer = checkedRadio.value;
                    }
                } else if (currentQuestion['題型'] === '多選') {
                    const checkedBoxes = optionsContainer.querySelectorAll('input[name="answer"]:checked');
                    const answers = Array.from(checkedBoxes).map(box => box.value);
                    answer = answers.join(',');
                }

                if (!answer) {
                    alert('請輸入或選擇一個答案！');
                    reject('no answer');
                    return;
                }

                fetchAPI('submitResponse', { 
                    name: username, 
                    questionId: currentQuestion['題號'], 
                    userAnswer: answer 
                }).then(result => {
                    if (result.success) {
                        alert(`作答成功！你獲得了 ${result.score} 分。你的總分為: ${result.totalScore}`);
                        userStatus.attempts[currentQuestion['題號']] = (userStatus.attempts[currentQuestion['題號']] || 0) + 1;
                        userStatus.responses[currentQuestion['題號']] = userStatus.responses[currentQuestion['題號']] || {};
                        userStatus.responses[currentQuestion['題號']].score = result.score;
                        userStatus.totalScore = result.totalScore;
                        
                        const attemptsLeft = currentQuestion['作答次數限制'] - userStatus.attempts[currentQuestion['題號']];
                        attemptsInfo.textContent = `剩餘作答次數: ${attemptsLeft}`;
                        submitBtn.disabled = attemptsLeft <= 0;
                        if (submitBtn.disabled) {
                            submitBtn.textContent = '已無作答次數';
                        }
                        
                        renderQuestionList();
                        updateProgressBar(); 
                        resolve();
                    } else {
                        alert('提交答案失敗: ' + result.error);
                        reject(result.error);
                    }
                }).catch(error => {
                    alert('連線錯誤，請稍後再試。');
                    reject(error);
                });
            });
        }

        function fetchRanking() {
            return fetchAPI('getRanking').then(data => {
                if (data.error) {
                    alert('載入排名失敗: ' + data.error);
                    return;
                }
                rankingContainer.innerHTML = '';
                data.forEach((rank, index) => {
                    const li = document.createElement('li');
                    li.textContent = `第 ${index + 1} 名: ${rank.name} - ${rank.score} 分`;
                    rankingContainer.appendChild(li);
                });
            }).catch(error => {
                alert('連線錯誤，請稍後再試。');
            });
        }
        
        function updateProgressBar() {
            if (maxPossibleScore > 0) {
                const percentage = (userStatus.totalScore / maxPossibleScore) * 100;
                scoreProgressBar.style.width = percentage + '%';
                currentScoreText.textContent = `總分：${userStatus.totalScore} / ${maxPossibleScore}`;
                scoreProgressBar.classList.add('animate');
                setTimeout(() => scoreProgressBar.classList.remove('animate'), 800);
            }
        }
    </script>
</body>
</html>
